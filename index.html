<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Font Metadata Editor</title>

    <!-- OpenType.js শুধু Font Metadata Read করার জন্য -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.1/dist/opentype.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            color: #333;
            padding: 20px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1a73e8;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        /* Upload */

        .file-box {
            border: 2px dashed #1a73e8;
            padding: 30px 20px;
            text-align: center;
            border-radius: 10px;
            background: #f8fafd;
            cursor: pointer;
            transition: .2s;
        }

        .file-box:hover,
        .file-box.dragover {
            background: #eef5ff;
            border-color: #0b57d0;
        }

        .file-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .file-box label {
            display: block;
            color: #1a73e8;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .file-box small {
            display: block;
            color: #777;
            margin-top: 8px;
        }

        #fontFile {
            display: none;
        }

        /* File Info */

        .file-info {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            background: #f5f7fa;
            border: 1px solid #e0e4e8;
            border-radius: 7px;
            font-size: 14px;
        }

        /* Editor */

        .editor-section {
            display: none;
            margin-top: 25px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            padding-bottom: 10px;
            margin-bottom: 18px;
            border-bottom: 2px solid #eee;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            background: #fff;
            font-size: 14px;
        }

        input[type="text"],
        select {
            height: 42px;
            padding: 0 12px;
        }

        textarea {
            min-height: 85px;
            padding: 10px 12px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, .1);
        }

        /* Preview */

        .preview-box {
            margin-top: 25px;
            padding: 18px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .preview-title {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .preview-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .preview-controls input {
            flex: 1;
        }

        .preview-controls select {
            width: 100px;
        }

        #fontPreviewText {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 18px;
            min-height: 110px;
            font-size: 28px;
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* Buttons */

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 13px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .btn-reset {
            background: #6c757d;
            color: #fff;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .btn-download {
            flex: 1;
            background: #28a745;
            color: #fff;
        }

        .btn-download:hover {
            background: #218838;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* Status */

        .status {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .status.success {
            display: block;
            color: #176b2c;
            background: #eaf7ee;
            border: 1px solid #b8e6c4;
        }

        .status.error {
            display: block;
            color: #b4232f;
            background: #fdecec;
            border: 1px solid #f3b8be;
        }

        .status.info {
            display: block;
            color: #1558a6;
            background: #eef5ff;
            border: 1px solid #b9d4f5;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        @media(max-width:600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .header h1 {
                font-size: 23px;
            }

            .preview-controls {
                flex-direction: column;
            }

            .preview-controls select {
                width: 100%;
            }

            .button-group {
                flex-direction: column;
            }

            #fontPreviewText {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Font Metadata Editor</h1>

        <p>
            TTF / OTF Font Metadata Editor
        </p>

    </div>


    <!-- =========================
         FILE UPLOAD
    ========================== -->

    <div
        class="file-box"
        id="dropZone"
    >

        <div class="file-icon">
            📁
        </div>

        <label for="fontFile">
            Select Font File
        </label>

        <small>
            TTF / OTF ফাইল এখানে Select অথবা Drag & Drop করুন
        </small>

        <input
            type="file"
            id="fontFile"
            accept=".ttf,.otf"
        >

    </div>


    <!-- =========================
         FILE INFO
    ========================== -->

    <div
        class="file-info"
        id="fileInfo"
    >

        <div>
            <strong>File:</strong>
            <span id="fileName"></span>
        </div>

        <div style="margin-top:5px;">
            <strong>Size:</strong>
            <span id="fileSize"></span>
        </div>

    </div>


    <!-- =========================
         EDITOR
    ========================== -->

    <div
        class="editor-section"
        id="editorSection"
    >

        <div class="section-title">
            Font Metadata
        </div>


        <div class="form-group">

            <label>
                Font Family Name | ফন্ট পরিবারের নাম
            </label>

            <input
                type="text"
                id="fontFamily"
            >

        </div>


        <div class="form-group">

            <label>
                Font Subfamily / Style | ফন্ট স্টাইল
            </label>

            <input
                type="text"
                id="fontSubfamily"
            >

        </div>


        <div class="form-group">

            <label>
                Unique Font Identifier | ফন্ট আইডেন্টিফায়ার
            </label>

            <input
                type="text"
                id="uniqueID"
            >

        </div>


        <div class="form-group">

            <label>
                Full Font Name | সম্পূর্ণ ফন্টের নাম
            </label>

            <input
                type="text"
                id="fullName"
            >

        </div>


        <div class="form-group">

            <label>
                Version String | ভার্সন
            </label>

            <input
                type="text"
                id="version"
            >

        </div>


        <div class="form-group">

            <label>
                PostScript Name | পোস্টস্ক্রিপ্ট নাম
            </label>

            <input
                type="text"
                id="postScriptName"
            >

        </div>


        <div class="form-group">

            <label>
                Manufacturer / Publisher | প্রকাশক
            </label>

            <input
                type="text"
                id="manufacturer"
            >

        </div>


        <div class="form-group">

            <label>
                Designer / Author | ডিজাইনার
            </label>

            <input
                type="text"
                id="designer"
            >

        </div>


        <div class="form-group">

            <label>
                Copyright Notice | কপিরাইট নোট
            </label>

            <input
                type="text"
                id="copyright"
            >

        </div>


        <div class="form-group">

            <label>
                License Description | লাইসেন্সের বিবরণ
            </label>

            <textarea id="license"></textarea>

        </div>


        <!-- =========================
             PREVIEW
        ========================== -->

        <div class="preview-box">

            <div class="preview-title">
                Live Font Preview | ফন্ট প্রিভিউ
            </div>

            <div class="preview-controls">

                <input
                    type="text"
                    id="previewInput"
                    value="Abc 123 - আমাদের দেশ আমার বাংলাদেশ। ঞ্চ ঞ্ছ ঞ্জ জ্ঞ ক্ষ হ্ম"
                >

                <select id="previewSize">

                    <option value="18">18px</option>
                    <option value="22">22px</option>
                    <option value="28" selected>28px</option>
                    <option value="34">34px</option>
                    <option value="42">42px</option>
                    <option value="52">52px</option>

                </select>

            </div>

            <div id="fontPreviewText">
                Abc 123 - আমাদের দেশ আমার বাংলাদেশ। ঞ্চ ঞ্ছ ঞ্জ জ্ঞ ক্ষ হ্ম
            </div>

        </div>


        <!-- =========================
             BUTTONS
        ========================== -->

        <div class="button-group">

            <button
                type="button"
                class="btn-reset"
                id="resetButton"
            >
                ↻ Reset
            </button>

            <button
                type="button"
                class="btn-download"
                id="downloadButton"
            >
                ⬇ Update Metadata & Download Font
            </button>

        </div>


        <div
            class="status"
            id="statusMessage"
        ></div>

    </div>


    <div class="footer">
        Font Metadata Editor • Browser Based Tool
    </div>

</div>


<script>

/* ============================================================
   GLOBAL VARIABLES
============================================================ */

let originalFontBuffer = null;

let loadedFont = null;

let originalFileName = "font.ttf";

let originalMetadata = {};


/* ============================================================
   ELEMENTS
============================================================ */

const fontFile =
    document.getElementById("fontFile");

const dropZone =
    document.getElementById("dropZone");

const editorSection =
    document.getElementById("editorSection");

const fileInfo =
    document.getElementById("fileInfo");

const statusMessage =
    document.getElementById("statusMessage");


/* ============================================================
   UTILITY
============================================================ */

function getValue(id) {

    const el = document.getElementById(id);

    return el ? el.value.trim() : "";

}


function setValue(id, value) {

    const el = document.getElementById(id);

    if (el) {
        el.value = value || "";
    }

}


function showStatus(message, type) {

    statusMessage.className =
        "status " + type;

    statusMessage.textContent =
        message;

}


function formatFileSize(bytes) {

    if (bytes < 1024) {
        return bytes + " Bytes";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* ============================================================
   READ LOCALIZED NAME
============================================================ */

function getLocalizedName(obj) {

    if (!obj) {
        return "";
    }

    if (typeof obj === "string") {
        return obj;
    }

    if (obj.en) {
        return obj.en;
    }

    const keys =
        Object.keys(obj);

    if (keys.length > 0) {
        return obj[keys[0]];
    }

    return "";

}


/* ============================================================
   PROCESS FONT
============================================================ */

function processFont(file) {

    if (!file) {
        return;
    }


    const name =
        file.name.toLowerCase();


    if (
        !name.endsWith(".ttf") &&
        !name.endsWith(".otf")
    ) {

        showStatus(
            "শুধু TTF অথবা OTF Font File ব্যবহার করুন।",
            "error"
        );

        return;
    }


    originalFileName =
        file.name;


    fileInfo.style.display =
        "block";


    document.getElementById(
        "fileName"
    ).textContent =
        file.name;


    document.getElementById(
        "fileSize"
    ).textContent =
        formatFileSize(file.size);


    showStatus(
        "Font file read করা হচ্ছে...",
        "info"
    );


    const reader =
        new FileReader();


    reader.onload = function(event) {

        try {

            /*
             * Original binary copy
             *
             * এই buffer কখনো opentype.js
             * দিয়ে rebuild করা হবে না।
             */

            originalFontBuffer =
                event.target.result.slice(0);


            /*
             * Metadata reading
             */

            loadedFont =
                opentype.parse(
                    originalFontBuffer.slice(0)
                );


            if (!loadedFont) {
                throw new Error(
                    "Unable to parse font"
                );
            }


            const names =
                loadedFont.names;


            originalMetadata = {

                fontFamily:
                    getLocalizedName(
                        names.fontFamily
                    ),

                fontSubfamily:
                    getLocalizedName(
                        names.fontSubfamily
                    ),

                uniqueID:
                    getLocalizedName(
                        names.uniqueID
                    ),

                fullName:
                    getLocalizedName(
                        names.fullName
                    ),

                version:
                    getLocalizedName(
                        names.version
                    ),

                postScriptName:
                    getLocalizedName(
                        names.postScriptName
                    ),

                manufacturer:
                    getLocalizedName(
                        names.manufacturer
                    ),

                designer:
                    getLocalizedName(
                        names.designer
                    ),

                copyright:
                    getLocalizedName(
                        names.copyright
                    ),

                license:
                    getLocalizedName(
                        names.license
                    )

            };


            /*
             * Fill form
             */

            setValue(
                "fontFamily",
                originalMetadata.fontFamily
            );

            setValue(
                "fontSubfamily",
                originalMetadata.fontSubfamily ||
                "Regular"
            );

            setValue(
                "uniqueID",
                originalMetadata.uniqueID
            );

            setValue(
                "fullName",
                originalMetadata.fullName
            );

            setValue(
                "version",
                originalMetadata.version ||
                "Version 1.00"
            );

            setValue(
                "postScriptName",
                originalMetadata.postScriptName
            );

            setValue(
                "manufacturer",
                originalMetadata.manufacturer
            );

            setValue(
                "designer",
                originalMetadata.designer
            );

            setValue(
                "copyright",
                originalMetadata.copyright
            );

            setValue(
                "license",
                originalMetadata.license
            );


            /*
             * Show editor
             */

            editorSection.style.display =
                "block";


            /*
             * Load preview
             */

            loadPreview(
                originalFontBuffer
            );


            showStatus(
                "Font successfully loaded। এখন Metadata edit করতে পারবেন।",
                "success"
            );

        }

        catch(error) {

            console.error(
                error
            );

            loadedFont = null;

            originalFontBuffer = null;

            editorSection.style.display =
                "none";

            showStatus(
                "এই Font File parse করা সম্ভব হয়নি।",
                "error"
            );

        }

    };


    reader.onerror = function() {

        showStatus(
            "Font File read করা সম্ভব হয়নি।",
            "error"
        );

    };


    reader.readAsArrayBuffer(file);

}


/* ============================================================
   FILE INPUT
============================================================ */

fontFile.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        processFont(file);

    }
);


/* ============================================================
   DRAG & DROP
============================================================ */

dropZone.addEventListener(
    "click",
    function() {

        fontFile.click();

    }
);


dropZone.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        dropZone.classList.add(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "dragleave",
    function() {

        dropZone.classList.remove(
            "dragover"
        );

    }
);


dropZone.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        dropZone.classList.remove(
            "dragover"
        );


        const file =
            event.dataTransfer.files[0];


        processFont(file);

    }
);


/* ============================================================
   PREVIEW
============================================================ */

function loadPreview(arrayBuffer) {

    try {

        const fontFace =
            new FontFace(
                "EditorPreviewFont",
                arrayBuffer
            );


        fontFace
            .load()
            .then(function(font) {

                document.fonts.add(font);

                updatePreview();

            })
            .catch(function(error) {

                console.warn(
                    "Preview error:",
                    error
                );

            });

    }

    catch(error) {

        console.warn(
            "Preview failed:",
            error
        );

    }

}


function updatePreview() {

    const preview =
        document.getElementById(
            "fontPreviewText"
        );

    const text =
        document.getElementById(
            "previewInput"
        );

    const size =
        document.getElementById(
            "previewSize"
        );


    preview.textContent =
        text.value;


    preview.style.fontSize =
        size.value + "px";


    preview.style.fontFamily =
        "EditorPreviewFont";

}


document.getElementById(
    "previewInput"
).addEventListener(
    "input",
    updatePreview
);


document.getElementById(
    "previewSize"
).addEventListener(
    "change",
    updatePreview
);


/* ============================================================
   BINARY HELPERS
============================================================ */

function readUInt16(data, offset) {

    return (
        (data[offset] << 8) |
        data[offset + 1]
    ) >>> 0;

}


function readUInt32(data, offset) {

    return (
        data[offset] * 0x1000000 +
        data[offset + 1] * 0x10000 +
        data[offset + 2] * 0x100 +
        data[offset + 3]
    ) >>> 0;

}


function writeUInt16(data, offset, value) {

    data[offset] =
        (value >> 8) & 0xff;

    data[offset + 1] =
        value & 0xff;

}


function writeUInt32(data, offset, value) {

    data[offset] =
        (value >>> 24) & 0xff;

    data[offset + 1] =
        (value >>> 16) & 0xff;

    data[offset + 2] =
        (value >>> 8) & 0xff;

    data[offset + 3] =
        value & 0xff;

}


/* ============================================================
   ASCII TAG
============================================================ */

function tagToString(data, offset) {

    return String.fromCharCode(
        data[offset],
        data[offset + 1],
        data[offset + 2],
        data[offset + 3]
    );

}


/* ============================================================
   UTF-16 BE ENCODER
============================================================ */

function encodeUTF16BE(text) {

    const bytes = [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const code =
            text.charCodeAt(i);


        /*
         * Normal BMP character
         */

        if (code <= 0xffff) {

            bytes.push(
                (code >> 8) & 0xff,
                code & 0xff
            );

        }

    }


    return new Uint8Array(bytes);

}


/* ============================================================
   BUILD NAME TABLE
============================================================ */

function buildNameTable(metadata) {

    /*
     * OpenType name IDs:
     *
     * 0  Copyright
     * 1  Family
     * 2  Subfamily
     * 3  Unique ID
     * 4  Full Name
     * 5  Version
     * 6  PostScript
     * 8  Manufacturer
     * 9  Designer
     * 13 License
     */


    const records = [

        {
            id: 0,
            value: metadata.copyright
        },

        {
            id: 1,
            value: metadata.fontFamily
        },

        {
            id: 2,
            value: metadata.fontSubfamily
        },

        {
            id: 3,
            value: metadata.uniqueID
        },

        {
            id: 4,
            value: metadata.fullName
        },

        {
            id: 5,
            value: metadata.version
        },

        {
            id: 6,
            value: metadata.postScriptName
        },

        {
            id: 8,
            value: metadata.manufacturer
        },

        {
            id: 9,
            value: metadata.designer
        },

        {
            id: 13,
            value: metadata.license
        }

    ];


    /*
     * Only create records which have a value.
     */

    const validRecords =
        records.filter(function(record) {

            return (
                record.value !== undefined &&
                record.value !== null &&
                record.value !== ""
            );

        });


    /*
     * We create Windows Unicode records.
     *
     * platformID = 3
     * encodingID = 1
     * languageID = 0x0409
     */

    const encodedRecords =
        validRecords.map(function(record) {

            return {

                platformID: 3,

                encodingID: 1,

                languageID: 0x0409,

                nameID: record.id,

                bytes: encodeUTF16BE(
                    String(record.value)
                )

            };

        });


    const count =
        encodedRecords.length;


    /*
     * Header = 6 bytes
     *
     * Record = 12 bytes
     */

    const recordBytes =
        count * 12;


    /*
     * String storage starts after
     * header + records.
     */

    let stringOffset =
        6 + recordBytes;


    let stringLength = 0;


    for (
        const record of encodedRecords
    ) {

        stringLength +=
            record.bytes.length;

    }


    const output =
        new Uint8Array(
            stringOffset + stringLength
        );


    /*
     * Name table header
     */

    writeUInt16(
        output,
        0,
        0
    );

    writeUInt16(
        output,
        2,
        count
    );

    writeUInt16(
        output,
        4,
        stringOffset
    );


    /*
     * Write records
     */

    let recordOffset = 6;

    let currentStringOffset = 0;


    for (
        const record of encodedRecords
    ) {

        writeUInt16(
            output,
            recordOffset,
            record.platformID
        );

        writeUInt16(
            output,
            recordOffset + 2,
            record.encodingID
        );

        writeUInt16(
            output,
            recordOffset + 4,
            record.languageID
        );

        writeUInt16(
            output,
            recordOffset + 6,
            record.nameID
        );

        writeUInt16(
            output,
            recordOffset + 8,
            record.bytes.length
        );

        writeUInt16(
            output,
            recordOffset + 10,
            currentStringOffset
        );


        recordOffset += 12;

        currentStringOffset +=
            record.bytes.length;

    }


    /*
     * Write strings
     */

    let stringPosition =
        stringOffset;


    for (
        const record of encodedRecords
    ) {

        output.set(
            record.bytes,
            stringPosition
        );

        stringPosition +=
            record.bytes.length;

    }


    return output;

}


/* ============================================================
   FIND TABLES
============================================================ */

function getFontTables(data) {

    const tables = {};

    const numTables =
        readUInt16(
            data,
            4
        );


    const directoryOffset = 12;


    for (
        let i = 0;
        i < numTables;
        i++
    ) {

        const offset =
            directoryOffset +
            i * 16;


        const tag =
            tagToString(
                data,
                offset
            );


        const checksum =
            readUInt32(
                data,
                offset + 4
            );


        const tableOffset =
            readUInt32(
                data,
                offset + 8
            );


        const tableLength =
            readUInt32(
                data,
                offset + 12
            );


        tables[tag] = {

            index: i,

            directoryOffset:
                offset,

            checksum:

                checksum,

            offset:
                tableOffset,

            length:
                tableLength

        };

    }


    return tables;

}


/* ============================================================
   PAD 4
============================================================ */

function align4(value) {

    return (
        (value + 3) &
        ~3
    );

}


/* ============================================================
   CHECKSUM
============================================================ */

function calculateChecksum(
    data,
    offset,
    length
) {

    let sum = 0;


    const end =
        offset +
        length;


    for (
        let i = offset;
        i < end;
        i += 4
    ) {

        const b0 =
            data[i] || 0;

        const b1 =
            data[i + 1] || 0;

        const b2 =
            data[i + 2] || 0;

        const b3 =
            data[i + 3] || 0;


        const value =
            (
                b0 * 0x1000000 +
                b1 * 0x10000 +
                b2 * 0x100 +
                b3
            ) >>> 0;


        sum =
            (sum + value) >>> 0;

    }


    return sum >>> 0;

}


/* ============================================================
   UPDATE NAME TABLE
============================================================ */

function updateFontBinary(
    originalBuffer,
    metadata
) {

    const original =
        new Uint8Array(
            originalBuffer
        );


    /*
     * Make a copy.
     */

    const originalLength =
        original.length;


    /*
     * Read tables.
     */

    const tables =
        getFontTables(
            original
        );


    if (!tables["name"]) {

        throw new Error(
            "Font does not contain a name table."
        );

    }


    const nameTable =
        buildNameTable(
            metadata
        );


    const nameInfo =
        tables["name"];


    /*
     * Important:
     *
     * We DO NOT modify glyph,
     * cmap, GSUB, GPOS, CFF,
     * glyf, fvar etc.
     *
     * We append the new name table
     * at the end of the font.
     */


    const newNameOffset =
        align4(
            originalLength
        );


    const newNameLength =
        nameTable.length;


    const finalLength =
        newNameOffset +
        align4(
            newNameLength
        );


    const result =
        new Uint8Array(
            finalLength
        );


    /*
     * Copy original font exactly.
     */

    result.set(
        original,
        0
    );


    /*
     * Padding before new table.
     */

    for (
        let i = originalLength;
        i < newNameOffset;
        i++
    ) {

        result[i] = 0;

    }


    /*
     * Write new name table.
     */

    result.set(
        nameTable,
        newNameOffset
    );


    /*
     * Update name directory entry.
     */

    const nameDirectoryOffset =
        nameInfo.directoryOffset;


    writeUInt32(
        result,
        nameDirectoryOffset + 8,
        newNameOffset
    );


    writeUInt32(
        result,
        nameDirectoryOffset + 12,
        newNameLength
    );


    /*
     * Set name checksum later.
     */

    writeUInt32(
        result,
        nameDirectoryOffset + 4,
        0
    );


    /*
     * head table is needed for
     * checkSumAdjustment.
     */

    const tablesAfter =
        getFontTables(
            result
        );


    const headInfo =
        tablesAfter["head"];


    if (!headInfo) {

        throw new Error(
            "Font does not contain a head table."
        );

    }


    /*
     * checkSumAdjustment is at
     * head + 8
     */

    writeUInt32(
        result,
        headInfo.offset + 8,
        0
    );


    /*
     * Recalculate all table checksums.
     */

    const tableCount =
        readUInt16(
            result,
            4
        );


    for (
        let i = 0;
        i < tableCount;
        i++
    ) {

        const directoryOffset =
            12 +
            i * 16;


        const tableOffset =
            readUInt32(
                result,
                directoryOffset + 8
            );


        const tableLength =
            readUInt32(
                result,
                directoryOffset + 12
            );


        /*
         * Checksum field itself must be zero
         * while calculating.
         */

        writeUInt32(
            result,
            directoryOffset + 4,
            0
        );


        const checksum =
            calculateChecksum(
                result,
                tableOffset,
                tableLength
            );


        writeUInt32(
            result,
            directoryOffset + 4,
            checksum
        );

    }


    /*
     * head checksum must be recalculated
     * after checkSumAdjustment is zero.
     */

    const freshTables =
        getFontTables(
            result
        );


    const freshHead =
        freshTables["head"];


    writeUInt32(
        result,
        freshHead.offset + 8,
        0
    );


    /*
     * head table checksum
     */

    writeUInt32(
        result,
        freshHead.directoryOffset + 4,
        0
    );


    const headChecksum =
        calculateChecksum(
            result,
            freshHead.offset,
            freshHead.length
        );


    writeUInt32(
        result,
        freshHead.directoryOffset + 4,
        headChecksum
    );


    /*
     * Calculate complete font checksum.
     */

    const totalChecksum =
        calculateChecksum(
            result,
            0,
            result.length
        );


    const checkSumAdjustment =
        (
            0xB1B0AFBA -
            totalChecksum
        ) >>> 0;


    writeUInt32(
        result,
        freshHead.offset + 8,
        checkSumAdjustment
    );


    /*
     * Recalculate head table checksum
     * because checkSumAdjustment changed.
     */

    writeUInt32(
        result,
        freshHead.directoryOffset + 4,
        0
    );


    const finalHeadChecksum =
        calculateChecksum(
            result,
            freshHead.offset,
            freshHead.length
        );


    writeUInt32(
        result,
        freshHead.directoryOffset + 4,
        finalHeadChecksum
    );


    return result.buffer;

}


/* ============================================================
   GET METADATA FROM FORM
============================================================ */

function getMetadataFromForm() {

    return {

        fontFamily:
            getValue("fontFamily"),

        fontSubfamily:
            getValue("fontSubfamily"),

        uniqueID:
            getValue("uniqueID"),

        fullName:
            getValue("fullName"),

        version:
            getValue("version"),

        postScriptName:
            getValue("postScriptName"),

        manufacturer:
            getValue("manufacturer"),

        designer:
            getValue("designer"),

        copyright:
            getValue("copyright"),

        license:
            getValue("license")

    };

}


/* ============================================================
   SAFE FILE NAME
============================================================ */

function createDownloadName() {

    let name =
        getValue("fontFamily");


    if (!name) {
        name = "edited-font";
    }


    name =
        name.replace(
            /[<>:"/\\|?*\x00-\x1F]/g,
            ""
        );


    name =
        name.trim();


    if (!name) {
        name = "edited-font";
    }


    return (
        "edited_" +
        name +
        ".ttf"
    );

}


/* ============================================================
   DOWNLOAD
============================================================ */

function saveAndDownload() {

    if (!originalFontBuffer) {

        showStatus(
            "প্রথমে একটি Font File Select করুন।",
            "error"
        );

        return;

    }


    const downloadButton =
        document.getElementById(
            "downloadButton"
        );


    try {

        downloadButton.disabled =
            true;


        showStatus(
            "Font metadata update করা হচ্ছে...",
            "info"
        );


        const metadata =
            getMetadataFromForm();


        /*
         * Required field
         */

        if (!metadata.fontFamily) {

            throw new Error(
                "Font Family Name খালি রাখা যাবে না।"
            );

        }


        /*
         * Build modified binary
         */

        const modifiedBuffer =
            updateFontBinary(
                originalFontBuffer,
                metadata
            );


        /*
         * IMPORTANT:
         *
         * এখানে loadedFont.toArrayBuffer()
         * একদম ব্যবহার করা হচ্ছে না।
         */


        const blob =
            new Blob(
                [modifiedBuffer],
                {
                    type:
                        originalFileName
                            .toLowerCase()
                            .endsWith(".otf")
                            ? "font/otf"
                            : "font/ttf"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            createDownloadName();


        document.body.appendChild(
            link
        );


        link.click();


        setTimeout(function() {

            document.body.removeChild(
                link
            );

            URL.revokeObjectURL(
                url
            );

        }, 1000);


        showStatus(
            "✅ Metadata successfully update হয়েছে। Font download শুরু হয়েছে।",
            "success"
        );

    }

    catch(error) {

        console.error(
            "Font update error:",
            error
        );


        showStatus(
            "❌ Font Metadata update করা যায়নি: " +
            error.message,
            "error"
        );

    }

    finally {

        setTimeout(function() {

            downloadButton.disabled =
                false;

        }, 1000);

    }

}


/* ============================================================
   RESET
============================================================ */

document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    function() {

        if (!originalFontBuffer) {

            showStatus(
                "প্রথমে একটি Font File Select করুন।",
                "error"
            );

            return;

        }


        setValue(
            "fontFamily",
            originalMetadata.fontFamily
        );

        setValue(
            "fontSubfamily",
            originalMetadata.fontSubfamily ||
            "Regular"
        );

        setValue(
            "uniqueID",
            originalMetadata.uniqueID
        );

        setValue(
            "fullName",
            originalMetadata.fullName
        );

        setValue(
            "version",
            originalMetadata.version ||
            "Version 1.00"
        );

        setValue(
            "postScriptName",
            originalMetadata.postScriptName
        );

        setValue(
            "manufacturer",
            originalMetadata.manufacturer
        );

        setValue(
            "designer",
            originalMetadata.designer
        );

        setValue(
            "copyright",
            originalMetadata.copyright
        );

        setValue(
            "license",
            originalMetadata.license
        );


        showStatus(
            "Original Metadata restore করা হয়েছে।",
            "success"
        );

    }
);
