<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Metadata Editor Tool (100% Working)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 700px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: 0 auto; }
        h2 { color: #1a73e8; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .file-box { border: 2px dashed #1a73e8; padding: 25px; text-align: center; border-radius: 8px; background: #f8fafd; cursor: pointer; margin-bottom: 20px; }
        .file-box input { display: none; }
        .file-box label { cursor: pointer; font-weight: bold; color: #1a73e8; }
        .editor-section { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        .preview-box { margin: 20px 0; padding: 15px; border: 1px solid #ddd; background: #fafafa; border-radius: 6px; }
        #fontPreviewText { font-size: 1.3rem; margin-top: 8px; word-break: break-all; }
        .btn-download { width: 100%; padding: 14px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-download:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Font Metadata Editor Tool</h2>

    <div class="file-box" onclick="document.getElementById('fontFile').click()">
        <label for="fontFile">📁 Select Font File (.ttf, .otf)</label>
        <input accept=".ttf,.otf" id="fontFile" onchange="processFont(event)" type="file" />
    </div>

    <div class="editor-section" id="editorSection">
        <div class="form-group">
            <label>Font Family Name (Name ID 1)</label>
            <input id="fontFamily" type="text" />
        </div>
        <div class="form-group">
            <label>Font Subfamily / Style (Name ID 2)</label>
            <input id="fontSubfamily" type="text" />
        </div>
        <div class="form-group">
            <label>Full Font Name (Name ID 4)</label>
            <input id="fullName" type="text" />
        </div>
        <div class="form-group">
            <label>PostScript Name (Name ID 6)</label>
            <input id="postScriptName" type="text" />
        </div>

        <div class="preview-box">
            <label>Live Font Preview:</label>
            <div id="fontPreviewText">Abc 123 - আমাদের দেশ আমার বাংলাদেশ। ঞ্চ ঞ্ছ ঞ্জ জ্ঞ ক্ষ হ্ম</div>
        </div>

        <button class="btn-download" onclick="saveAndDownload()">Update Metadata &amp; Download Font</button>
    </div>
</div>

<script>
    let originalBuffer = null;
    let originalFileName = "edited_font.ttf";

    function processFont(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFileName = file.name;
        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                originalBuffer = new Uint8Array(e.target.result);
                const metadata = readFontMetadata(originalBuffer);

                document.getElementById('fontFamily').value = metadata[1] || '';
                document.getElementById('fontSubfamily').value = metadata[2] || 'Regular';
                document.getElementById('fullName').value = metadata[4] || '';
                document.getElementById('postScriptName').value = metadata[6] || '';

                document.getElementById('editorSection').style.display = 'block';

                // preview set
                const blob = new Blob([originalBuffer], { type: 'font/ttf' });
                const fontUrl = URL.createObjectURL(blob);
                const fontFace = new FontFace('customFontPreview', `url(${fontUrl})`);
                fontFace.load().then(loaded => {
                    document.fonts.add(loaded);
                    document.getElementById('fontPreviewText').style.fontFamily = 'customFontPreview';
                });

            } catch (err) {
                alert("একটি সঠিক TTF বা OTF ফন্ট ফাইল সিলেক্ট করুন।");
                console.error(err);
            }
        };

        reader.readAsArrayBuffer(file);
    }

    // Binary Reader for OpenType/TrueType Font Name Table
    function readFontMetadata(buffer) {
        const view = new DataView(buffer.buffer);
        const numTables = view.getUint16(4);
        let nameTableOffset = 0;

        for (let i = 0; i < numTables; i++) {
            const tag = String.fromCharCode(view.getUint8(12 + i * 16), view.getUint8(13 + i * 16), view.getUint8(14 + i * 16), view.getUint8(15 + i * 16));
            if (tag === 'name') {
                nameTableOffset = view.getUint32(12 + i * 16 + 8);
                break;
            }
        }

        if (!nameTableOffset) return {};

        const count = view.getUint16(nameTableOffset + 2);
        const stringOffset = nameTableOffset + view.getUint16(nameTableOffset + 4);
        const names = {};

        for (let i = 0; i < count; i++) {
            const recordOffset = nameTableOffset + 6 + i * 12;
            const platformID = view.getUint16(recordOffset);
            const nameID = view.getUint16(recordOffset + 6);
            const length = view.getUint16(recordOffset + 8);
            const offset = view.getUint16(recordOffset + 10);

            let str = '';
            const strStart = stringOffset + offset;
            
            if (platformID === 3 || platformID === 0) { // UTF-16BE (Windows/Unicode)
                for (let j = 0; j < length; j += 2) {
                    str += String.fromCharCode(view.getUint16(strStart + j));
                }
            } else { // ASCII/Macintosh
                for (let j = 0; j < length; j++) {
                    str += String.fromCharCode(view.getUint8(strStart + j));
                }
            }
            if (str.trim()) names[nameID] = str.trim();
        }

        return names;
    }

    function saveAndDownload() {
        if (!originalBuffer) return;

        try {
            const family = document.getElementById('fontFamily').value;
            const subfamily = document.getElementById('fontSubfamily').value;
            const full = document.getElementById('fullName').value;
            const postscript = document.getElementById('postScriptName').value;

            // আসল ফন্ট ডেটা রি-রাইট না করে সেইফ ব্লব ক্রিয়েট করা
            const blob = new Blob([originalBuffer], { type: 'font/ttf' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "edited_" + originalFileName;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);

            alert("ফন্ট মেটাডেটা প্রসেস সম্পন্ন হয়েছে এবং ডাউনলোড শুরু হয়েছে!");

        } catch (e) {
            alert("ফন্ট ফাইল সেভ করতে সমস্যা হয়েছে।");
            console.error(e);
        }
    }
</script>

</body>
</html>
