<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Metadata Editor Tool</title>
    <!-- opentype.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { width: 100%; max-width: 750px; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { color: #1a73e8; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; text-align: center; }
        .file-box { border: 2px dashed #1a73e8; padding: 25px; text-align: center; border-radius: 8px; background: #f8fafd; cursor: pointer; margin-bottom: 20px; }
        .file-box input { display: none; }
        .file-box label { cursor: pointer; font-weight: bold; color: #1a73e8; font-size: 1rem; display: block; }
        .editor-section { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; color: #444; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; outline: none; }
        textarea { resize: vertical; height: 70px; }
        .preview-box { margin: 20px 0; padding: 15px; border: 1px solid #e0e0e0; background: #fafafa; border-radius: 6px; }
        #fontPreviewText { font-size: 1.3rem; margin-top: 8px; word-break: break-all; }
        .btn-download { width: 100%; padding: 14px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-download:hover { background: #218838; }
        .loading { display: none; text-align: center; font-weight: bold; color: #1a73e8; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Font Metadata Editor</h2>

    <div class="file-box" onclick="document.getElementById('fontFile').click()">
        <label for="fontFile" id="fileLabel">📁 Select Font File (.ttf, .otf)</label>
        <input type="file" id="fontFile" accept=".ttf,.otf" onchange="handleFileSelect(event)">
    </div>

    <div class="loading" id="loadingText">ফন্টের মেটাডেটা পড়া হচ্ছে...</div>

    <div class="editor-section" id="editorSection">
        <form id="fontForm" onsubmit="downloadEditedFont(event)">
            <div class="form-group">
                <label>Font Family Name | ফন্ট পরিবারের নাম</label>
                <input type="text" id="fontFamily" required>
            </div>

            <div class="form-group">
                <label>Font Subfamily / Style | ফন্ট স্টাইল</label>
                <input type="text" id="fontSubfamily">
            </div>

            <div class="form-group">
                <label>Unique Font Identifier | ফন্ট আইডেন্টিফায়ার</label>
                <input type="text" id="uniqueID">
            </div>

            <div class="form-group">
                <label>Full Font Name | সম্পূর্ণ ফন্টের নাম</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-group">
                <label>Version String | ভার্সন</label>
                <input type="text" id="version">
            </div>

            <div class="form-group">
                <label>PostScript Name | পোস্টস্ক্রিপ্ট নাম</label>
                <input type="text" id="postScriptName">
            </div>

            <div class="form-group">
                <label>Manufacturer / Publisher | প্রকাশক</label>
                <input type="text" id="manufacturer">
            </div>

            <div class="form-group">
                <label>Designer / Author | ডিজাইনার</label>
                <input type="text" id="designer">
            </div>

            <div class="form-group">
                <label>Copyright Notice | কপিরাইট নোট</label>
                <input type="text" id="copyright">
            </div>

            <div class="form-group">
                <label>License Description | লাইসেন্সের বিবরণ</label>
                <textarea id="license"></textarea>
            </div>

            <div class="preview-box">
                <label>Live Font Preview | ফন্ট প্রিভিউ:</label>
                <div id="fontPreviewText">Abc 123 - আমাদের দেশ আমার বাংলাদেশ। ঞ্চ ঞ্ছ ঞ্জ জ্ঞ ক্ষ হ্ম</div>
            </div>

            <button type="submit" class="btn-download">Update Metadata & Download Font</button>
        </form>
    </div>
</div>

<script>
    let currentFont = null;
    let originalFileName = "font.ttf";

    // মেটাডেটা নাম এক্সট্রাক্ট করার সেফ ফাংশন
    function getNameRecord(names, field) {
        if (!names || !names[field]) return '';
        const rec = names[field];
        if (typeof rec === 'string') return rec;
        if (typeof rec === 'object') {
            return rec.en || rec[Object.keys(rec)[0]] || '';
        }
        return '';
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFileName = file.name;
        document.getElementById('fileLabel').innerText = "📄 সিলেক্টেড ফাইল: " + file.name;
        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('editorSection').style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const arrayBuffer = e.target.result;
                currentFont = opentype.parse(arrayBuffer);

                const names = currentFont.names;

                // ইনপুট ফিল্ড অটো-ফিল করা
                document.getElementById('fontFamily').value = getNameRecord(names, 'fontFamily');
                document.getElementById('fontSubfamily').value = getNameRecord(names, 'fontSubfamily') || 'Regular';
                document.getElementById('uniqueID').value = getNameRecord(names, 'uniqueID');
                document.getElementById('fullName').value = getNameRecord(names, 'fullName');
                document.getElementById('version').value = getNameRecord(names, 'version') || 'Version 1.00';
                document.getElementById('postScriptName').value = getNameRecord(names, 'postScriptName');
                document.getElementById('manufacturer').value = getNameRecord(names, 'manufacturer');
                document.getElementById('designer').value = getNameRecord(names, 'designer');
                document.getElementById('copyright').value = getNameRecord(names, 'copyright');
                document.getElementById('license').value = getNameRecord(names, 'license');

                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';

                // ফন্ট প্রিভিউ সেটআপ
                const fontUrl = URL.createObjectURL(file);
                const fontFace = new FontFace('customFontPreview', `url(${fontUrl})`);
                fontFace.load().then(function(loaded) {
                    document.fonts.add(loaded);
                    document.getElementById('fontPreviewText').style.fontFamily = 'customFontPreview';
                }).catch(function(err) {
                    console.warn("প্রিভিউ লোড করা যায়নি:", err);
                });

            } catch (err) {
                alert("ফন্ট ফাইলটি পড়তে সমস্যা হয়েছে। দয়া করে সঠিক .ttf বা .otf ফাইল দিন।");
                document.getElementById('loadingText').style.display = 'none';
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function downloadEditedFont(event) {
        event.preventDefault();
        if (!currentFont) return;

        // নতুন ইনপুট অনুযায়ী মেটাডেটা অবজেক্ট আপডেট
        currentFont.names.fontFamily = { en: document.getElementById('fontFamily').value };
        currentFont.names.fontSubfamily = { en: document.getElementById('fontSubfamily').value };
        currentFont.names.uniqueID = { en: document.getElementById('uniqueID').value };
        currentFont.names.fullName = { en: document.getElementById('fullName').value };
        currentFont.names.version = { en: document.getElementById('version').value };
        currentFont.names.postScriptName = { en: document.getElementById('postScriptName').value };
        currentFont.names.manufacturer = { en: document.getElementById('manufacturer').value };
        currentFont.names.designer = { en: document.getElementById('designer').value };
        currentFont.names.copyright = { en: document.getElementById('copyright').value };
        currentFont.names.license = { en: document.getElementById('license').value };

        // নতুন ফাইল হিসেবে ডাউনলোড তৈরি করা
        const fontBuffer = currentFont.toArrayBuffer();
        const blob = new Blob([fontBuffer], { type: 'font/ttf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "edited_" + originalFileName;
        link.click();
    }
</script>

</body>
</html>
